    note: "روجع التقرير ووُسّع. تحققت من أرقام الفيفا 2025 (1.37 مليار دولار، و889.4 مليون في 2023، و3010 انتقالات، وإنجلترا 375 مليوناً، وألمانيا 165 مليوناً، و10,525 وكيلاً)، ومن تصنيف CIES (2.56 و1.86 و1.27 مليار يورو)، ومن حكم محكمة العدل الأوروبية في 16 يوليو 2026. وصُححت أو حُذفت أمور: رقم إيبك سبورتس في تصنيف CIES (517 مليوناً) غير وارد في التقرير الأصلي فحُذف، وقيمة The.Team صُححت إلى 1.27 مليار، والإقامة في دبي ثابتة وفق إي إس بي إن (منذ مطلع 2026)، وحُذفت الإشارة السياسية إلى سبب هجرة العائلة. وأضيف من إي إس بي إن: بداياته وسيطاً في بلغاريا، وصفقة دجيكو 2015، ونموذج إيبك 22، وجائزتا أفضل وكيل 2023 و2025، وآراء الصناعة المنقسمة. وحُذفت روابط الصور المؤقتة ومعاملات التتبع. وصفحة ذا تلغراف تعذر فتحها، فأُخذ منها ما ورد في نص المالك فقط. والصور: غيتي 1000218762 (تقديم رونالدو في يوفنتوس 2018 بحضور مينديز) في الأعلى، وغيتي 977341946 (مينو رايولا) داخل النص بدلاً من 56221614 (رونالدو) بطلب المالك في 24 نوفمبر، وكلتاهما أرسلهما المالك. ورُفضت صورة توقيع سيمونز لأنها صورة نادٍ ويظهر فيها إعلان مراهنات."
