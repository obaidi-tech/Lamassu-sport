    details: سنتان بدوام كامل (120 وحدة أوروبية) بالإنجليزية. الرسوم لغير مواطني الاتحاد الأوروبي 10,000 يورو، مع خصم للتسجيل المبكر، ويمكن التقدم لمنحة بعد السنة الأولى. التقديم مرة واحدة سنوياً في يناير، والدراسة تبدأ في أغسطس.
