# «لاماسو | الفرص والتطوير الرياضي» — كل فرصة تحققنا منها في صفحتها الرسمية.
# القواعد (الميثاق، البند 2-ب والبند 7):
#  - الرابط هو الصفحة الرسمية للجهة المانحة نفسها، لا موقع تجميع ولا وسيط.
#  - لا يُكتب رقم أو موعد غير موجود في الصفحة الرسمية. وما لم تذكره الصفحة يُكتب «لم تذكره الصفحة الرسمية».
#  - البرنامج المدفوع يُكتب support: paid، ولا يظهر أبداً تحت «منح».
#  - تُنقل الفرصة تلقائياً إلى «أرشيف الفرص المغلقة» في اليوم التالي لـ deadline.
#  - verified: تاريخ آخر تحقق من الصفحة الرسمية. وروابط الصفحة تُفحص شهرياً آلياً (.github/workflows/opportunities-links.yml).
#
# الحقول:
#   field:   academic | science | coaching | management | media | tech | development | career
#   support: full (منحة كاملة) | partial (تمويل جزئي) | free (تدريب مجاني) | paid (برنامج مدفوع) | project (دعم مشروع) | nomination (عبر ترشيح الجهات الوطنية)
#   opens / deadline: YYYY-MM-DD (اختياري). recurring: true للبرامج الدورية التي لم يُعلن موعد دورتها التالية.

opportunities:
  - id: ksu-fifa-cies-2027
    title: برنامج FIFA/CIES الدولي في الإدارة الرياضية (الدورة الثالثة 2027)
    org: جامعة الملك سعود، بالشراكة مع المركز الدولي للدراسات الرياضية (CIES) وفيفا
    country: السعودية (الرياض وجدة)
    field: management
    support: paid
    audience: مديرو الأندية ومسؤولو الاتحادات والعاملون في التسويق الرياضي ووكلاء اللاعبين ومديرو المنشآت
    eligibility: بكالوريوس في أي تخصص، وخبرة 3 سنوات على الأقل في القطاع الرياضي، وإثبات إجادة الإنجليزية (STEP أو TOEFL أو IELTS)، واجتياز مقابلة القبول
    details: من 6 إلى 8 أشهر (180 ساعة معتمدة) بحضور غير مكثف، ويبدأ في 15 مارس 2027. المقابلات من 17 إلى 21 يناير 2027، والقرار النهائي في 1 فبراير 2027. الرسوم لم تذكرها الصفحة الرسمية.
    opens: 2026-11-08
    deadline: 2026-12-08
    link: https://fifa-cies.ksu.edu.sa/en
    verified: 2026-11-06

  - id: maisi-2027
    title: ماجستير إيراسموس موندوس في أخلاقيات الرياضة ونزاهتها (MAiSI)
    org: تحالف جامعات أوروبية بقيادة جامعة لوفين الكاثوليكية (KU Leuven)
    country: بلجيكا والتشيك وإسبانيا وألمانيا واليونان
    field: academic
    support: full
    audience: المهتمون بحوكمة الرياضة ونزاهتها وحماية الرياضيين
    eligibility: منح إيراسموس موندوس متاحة لكل الجنسيات لمن يستوفي شروط القبول الأكاديمية
    details: ماجستير بدوام كامل مدته سنتان، يتنقل فيه الطالب بين لوفين وبراغ وبرشلونة أو ماينتس، مع مدارس صيفية في أولمبيا. تشمل منحة إيراسموس موندوس تكاليف المشاركة ومخصصاً شهرياً قدره 1,400 يورو. موعد التقديم للمنحة 1 فبراير، ولغير المتقدمين للمنحة من خارج المنطقة الاقتصادية الأوروبية 1 أبريل.
    opens: 2026-10-08
    deadline: 2027-02-01
    link: https://www.maisi-project.eu/
    verified: 2026-11-06

  - id: uefa-mip-7
    title: الماجستير التنفيذي للاعبين الدوليين (UEFA MIP) — الدورة السابعة
    org: أكاديمية الاتحاد الأوروبي لكرة القدم (UEFA Academy)
    country: أوروبا، مع جلستين في الولايات المتحدة وأمريكا الجنوبية
    field: career
    support: paid
    audience: لاعبو كرة القدم وكرة الصالات الدوليون السابقون، والحكام والمدربون الدوليون
    eligibility: لاعب أو حكم أو مدرب دولي سابق. ومن لا يعمل في هيئة رياضية يُكمل تدريباً عملياً لمدة 3 أشهر
    details: 24 شهراً بالإنجليزية، في ثماني جلسات أسبوعية، ويمنح ماجستيراً تنفيذياً بقيمة 60 وحدة أوروبية (ECTS). الرسوم 28,500 يورو، وتتوفر منح دراسية. يبدأ في 11 أكتوبر 2027.
    deadline: 2027-05-31
    link: https://uefaacademy.com/courses/mip/
    verified: 2026-11-06

  - id: jyu-sport-business
    title: ماجستير الإدارة المسؤولة والأعمال الرياضية
    org: جامعة يوفاسكولا
    country: فنلندا
