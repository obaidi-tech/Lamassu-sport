  - id: juventus
    match: ["يوفنتوس", "Juventus"]
    commons: search:Allianz Stadium Turin Juventus interior
    alt: ملعب يوفنتوس في تورينو
  - id: san-siro
    match: ["إنتر ميلان", "إنتر", "ميلان", "Inter Milan", "AC Milan", "سان سيرو"]
