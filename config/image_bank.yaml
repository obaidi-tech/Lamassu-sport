# بنك الصور: صور حرة، عريضة وعالية الدقة، لأكثر الأندية والملاعب والبطولات ظهوراً في أخبارنا.
# الخبر الذي ليست له صورة يأخذ صورة الاسم الذي يظهر أولاً في عنوانه، ثم في مقتطفه.
# match: أسماء كاملة فقط (لا «سيتي» ولا «يونايتد» وحدهما)، و not: عبارات تمنع المطابقة.
# commons: اسم ملف محدد، أو search:كلمات (يختار البحث أفضل صورة عريضة، ويُحفظ الاختيار).
# كل صورة هنا راجعها المحرر بالعين قبل اعتمادها (انظر docs/image-bank.jpg).

entries:
  # ── أندية أوروبا ──
  - id: real-madrid
    match: ["ريال مدريد", "Real Madrid", "برنابيو"]
    not: ["ريال مدريد كاستيا"]
