# المصادر المجانية. كلها عامة ولا تتطلب اشتراكاً أو امتيازاً.
# الحقول:
#   kind: official | agency | major_media | media | aggregator | opinion
#   category: (اختياري) يفرض الفئة لكل أخبار المصدر
