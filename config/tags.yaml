# الوسوم المعتمدة في لاماسو (قرار المالك 8 نوفمبر 2026).
# - تُضاف الوسوم تلقائياً من عنوان الخبر وسطر التلخيص، أو يدوياً بسطر  tags: [ريال مدريد]  في رأس الخبر.
# - ثلاثة وسوم على الأكثر لكل خبر، ولا تُنشر صفحة الوسم ولا يظهر على الأخبار قبل أن يحمله ثلاثة أخبار على الأقل.
# - للإضافة: الاسم كما يظهر للقارئ، ورابط لاتيني قصير (slug)، وصيغ أخرى للاسم اختيارياً (match)،
#   وعبارات لا تُحتسب للوسم (exclude)، مثل «كأس العالم للأندية» لوسم كأس العالم.
# - تقتصر الوسوم على الفرق والبطولات والأسماء المتكررة، ولا تُكتب وسوم (#) داخل نص الخبر.
tags:
  # البطولات والهيئات
  - {name: فيفا, slug: fifa, match: [الفيفا, الاتحاد الدولي لكرة القدم]}
  - {name: كأس العالم, slug: world-cup, match: [مونديال, المونديال], exclude: [كأس العالم للأندية, مونديال الأندية]}
  - {name: دوري أبطال أوروبا, slug: champions-league}
  - {name: الدوري الإنجليزي, slug: premier-league, match: [الدوري الإنجليزي الممتاز]}
  - {name: الدوري الإسباني, slug: la-liga}
  - {name: الدوري الإيطالي, slug: serie-a}
  - {name: الدوري الألماني, slug: bundesliga}
  - {name: الدوري الأمريكي, slug: mls}
  - {name: الكرة الأفريقية, slug: african-football, match: [كاف, الاتحاد الأفريقي لكرة القدم, دوري أبطال أفريقيا, السوبر الأفريقي, كأس الكونفدرالية]}
  - {name: الكرة الذهبية, slug: ballon-dor}
  - {name: الفورمولا 1, slug: formula-1, match: [فورمولا 1, فورمولا, الفورمولا]}
  - {name: الموتو جي بي, slug: motogp, match: [موتو جي بي, الدراجات النارية]}
  - {name: التنس, slug: tennis, match: [ويمبلدون, رولان غاروس, أمريكا المفتوحة, أستراليا المفتوحة, الأساتذة]}
  - {name: الأولمبياد, slug: olympics, match: [الأولمبية, الأولمبي, الألعاب الأولمبية]}
  # الأندية
  - {name: ريال مدريد, slug: real-madrid}
  - {name: برشلونة, slug: barcelona}
  - {name: ليفربول, slug: liverpool}
  - {name: مانشستر يونايتد, slug: manchester-united}
  - {name: مانشستر سيتي, slug: manchester-city}
  - {name: أرسنال, slug: arsenal}
  - {name: بايرن ميونخ, slug: bayern, match: [بايرن]}
  - {name: باريس سان جيرمان, slug: psg, match: [سان جيرمان]}
  - {name: يوفنتوس, slug: juventus}
  - {name: إنتر ميامي, slug: inter-miami}
  - {name: النصر, slug: al-nassr, match: [النصر السعودي]}
  # الأسماء المتكررة
  - {name: رونالدو, slug: ronaldo, match: [كريستيانو رونالدو]}
  - {name: ميسي, slug: messi, match: [ليونيل ميسي]}
  - {name: ألكاراز, slug: alcaraz}
  - {name: إنفانتينو, slug: infantino}
