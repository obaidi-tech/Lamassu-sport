# إعدادات الموقع العامة — غيّر الاسم هنا فقط
site_name: "Lamassu"
site_name_en: ""
tagline: "قوة في التغطية، ثقة في المصدر"
tagline_en: "Strength in Coverage, Trust in Sources"   # للحسابات والمشاركة الدولية
description: "Lamassu: أهم أخبار الرياضة العالمية يومياً، مع مصادرها كاملة. قوة في التغطية، ثقة في المصدر."
site_url: "https://obaidi-tech.github.io/Lamassu-sport"
contact_email: ""                                       # بريد التواصل وطلبات التصحيح (يظهر في صفحة "تواصل معنا")
owner_name: "محمد العبيدي"                              # صاحب الموقع: يُربط اسمه بلينكدإن تحت مقالاته
linkedin_url: "https://www.linkedin.com/in/al0baidi"
google_site_verification: "XKPOWis_ohj3JA_Ij46o99p0IODwohHvgIWkCBJeIfA"                            # رمز Google Search Console (من وسم HTML)
month_names: gulf                                       # gulf = نوفمبر | levant = تشرين الثاني
language: ar
timezone: "Asia/Riyadh"

# النشر اليومي: 50 سقف أعلى؛ في الأيام الهادئة يُنشر أقل (انظر min_score في categories.yaml)
daily_total: 50
# أوقات التشغيل (بتوقيت المنطقة أعلاه). كل تشغيل ينشر حصته؛ تشغيل كل ساعتين يوزّع الأخبار على اليوم
run_hours: [6, 8, 10, 12, 14, 16, 18, 20, 22]
# المسافة بين خبر وآخر عند الجدولة (دقائق)
spacing_minutes: 20
# أقصى عمر للخبر المقبول (ساعات)
max_age_hours: 36

# أين يُنشر:
#   static    = موقع ثابت يبنيه المحرك بنفسه ويُستضاف مجاناً على GitHub Pages (النسخة التجريبية)
#   wordpress = يرسل الأخبار إلى موقع ووردبريس قائم
output: static

# وضع النشر:
#   auto  = الأخبار السليمة تُنشر آلياً، والحساسة تذهب إلى قائمة المراجعة (content/pending)
#   draft = كل شيء ينتظر موافقة المحرر
publish_mode: auto

llm:
  provider: anthropic
  model: "claude-haiku-5-5"      # أرخص؛ للجودة الأعلى: claude-sonnet-5-5
  max_tokens: 1400
  temperature: 0.3

wordpress:
  # القيم السرية تُقرأ من متغيرات البيئة: WP_URL, WP_USER, WP_APP_PASSWORD
  default_author_id: null

# صور الواجهة المتحركة في الصفحة الرئيسية: صور رياضية عامة حرة من Unsplash، تتبدل كل 7 ثوانٍ
# لكل صورة: رابط صفحتها، والرابط المباشر images.unsplash.com، واسم المصور (يظهر تلقائياً على الصورة)
