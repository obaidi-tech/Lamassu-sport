linkedin_url: ""   # أُوقف مؤقتاً 5 نوفمبر 2026: تُرتَّب وسائل التواصل لاحقاً (كان: https://www.linkedin.com/in/al0baidi)
# نموذج التواصل الرسمي الوحيد (Google Form) بخيارين: «طلب تصحيح أو توضيح تحريري» و«إبلاغ عن محاولة انتحال
# أو نشاط مالي مشبوه» (الميثاق، البند 7). عند وضعه تشير إليه روابط التصحيح وصفحة حدود المسؤولية وصفحة التواصل
contact_form_url: ""
corrections_form_url: ""        # (قديم) يُستخدم فقط إن لم يوضع contact_form_url
editor_name: "محمد العبيدي"       # المسؤول عن التحرير، يظهر في سياسة الموقع وسجل التصحيحات
