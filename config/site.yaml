      - commons: File:2013 Warrior Games Wheelchair Basketball 130414-N-DT940-550.jpg
        alt: كرة السلة على الكراسي المتحركة
      - commons: File:Women's wheelchair, London Marathon 2011.jpg
        alt: سباق السيدات على الكراسي المتحركة
  # صورة ثابتة واحدة لكل قسم (خفيفة)
  top5:
