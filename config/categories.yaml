# الحصص اليومية = سقف أعلى لا هدف إلزامي (المجموع 20). النوعية قبل الكمية: المتوقع 10 إلى 20 يومياً،
# وفي الأيام الهادئة يُنشر أقل. أرقام مبدئية تُراجع بعد دراسة الوضع (6 نوفمبر 2026).
# max_per_sub = أقصى عدد أخبار لكل دوري/رياضة/دولة داخل الفئة
# min_score   = أدنى درجة أهمية مقبولة. القصة الأضعف لا تُنشر حتى لو بقيت الحصة ناقصة.
#   للتقريب: ناشر كبير واحد حديث ≈ 2، ناشران موثوقان ≈ 4، خبر تغطيه 5 جهات ≈ 9
# الترتيب هنا = أولوية التصنيف عند تداخل الكلمات المفتاحية

categories:
  opinion:
    name_ar: "رأي"
    quota: 2
    min_score: 0
    max_per_sub: 1          # sub = الكاتب
  nba:
    name_ar: "كرة السلة الأمريكية"
    quota: 2
    min_score: 4
    max_per_sub: 3
  orgs:
    name_ar: "دولي وقاري"
