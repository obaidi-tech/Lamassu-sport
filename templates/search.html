{% extends "base.html" %}
{% block title %}البحث | {{ site.site_name }}{% endblock %}
{% block description %}ابحث في أخبار {{ site.site_name }} ومقالاته باسم فريق أو لاعب أو بطولة أو مصدر.{% endblock %}
{% block main %}
<div class="page-head"><h1>البحث</h1><p>ابحث باسم فريق أو لاعب أو بطولة أو مصدر.</p></div>
<form class="search" role="search" action="search.html" method="get">
  <label for="q" class="visually-hidden">كلمات البحث</label>
  <input id="q" name="q" type="search" placeholder="مثال: كأس آسيا، بايرن، الاتحاد الآسيوي" autocomplete="off" autofocus>
  <button type="submit">ابحث</button>
</form>
<p class="search__status" id="search-status" aria-live="polite"></p>
<ol class="latest" id="search-results"></ol>
<noscript><p class="empty">يحتاج البحث إلى تفعيل JavaScript في المتصفح. يمكنك تصفح <a href="latest.html">آخر الأخبار</a> أو <a href="archive.html">الأرشيف</a>.</p></noscript>
<script>
(function () {
  var cats = {{ cat_names | tojson_ar }};
  var norm = function (t) {
    return (t || '').toLowerCase()
      .replace(/[ً-ٰٟـ]/g, '')       // diacritics + tatweel
      .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
      .replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); });
  };
  var stem = function (w) { return w.length > 4 && w.indexOf('ال') === 0 ? w.slice(2) : w; };
  var input = document.getElementById('q'), out = document.getElementById('search-results'),
      status = document.getElementById('search-status'), index = null;
  var esc = function (s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
  function run(q) {
    var terms = norm(q).split(/[\s،,.:؛]+/).filter(function (w) { return w.length > 1; }).map(stem);
    out.innerHTML = '';
    if (!terms.length) { status.textContent = ''; return; }
    var hits = [];
    index.forEach(function (d) {
      var t = norm(d.t), e = norm(d.e), b = norm(d.b), s = norm(d.s), score = 0, all = true;
      terms.forEach(function (w) {
        var p = (t.indexOf(w) > -1 ? 6 : 0) + (e.indexOf(w) > -1 ? 3 : 0) + (s.indexOf(w) > -1 ? 2 : 0) + (b.indexOf(w) > -1 ? 1 : 0);
        if (!p) all = false; score += p;
      });
      if (all) hits.push([score, d]);
    });
    hits.sort(function (a, b) { return b[0] - a[0] || (b[1].d > a[1].d ? 1 : -1); });
    status.textContent = hits.length ? ('النتائج: ' + hits.length) : 'لا نتائج. جرّب كلمة أخرى أو اسماً أقصر.';
    out.innerHTML = hits.slice(0, 50).map(function (h) {
      var d = h[1];
      return '<li class="latest__item" style="--cat: var(--c-' + d.c + ')"><time>' + esc(d.dl) + '</time><div>' +
        '<a class="cat-link" href="category/' + d.c + '.html">' + esc(cats[d.c] || '') + '</a>' +
        '<h3><a href="' + d.u + '">' + esc(d.t) + '</a></h3><p class="excerpt">' + esc(d.e) + '</p></div></li>';
    }).join('');
  }
  var q = new URLSearchParams(location.search).get('q') || '';
  input.value = q;
  fetch('search-index.json').then(function (r) { return r.json(); }).then(function (data) {
    index = data; if (q) run(q);
    var timer; input.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { run(input.value); }, 150); });
  }).catch(function () { status.textContent = 'تعذر تحميل فهرس البحث. أعد تحميل الصفحة.'; });
})();
</script>
{% endblock %}
