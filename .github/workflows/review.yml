# إعادة بناء الموقع فوراً عند:
#   - تغيير "decision" في ملف داخل content/pending إلى "publish" أو "reject"
#   - إضافة مقال خاص أو تعديله في content/posts
#   - أي تعديل على التصميم أو الإعدادات (templates، site_assets، config، newsroom)
name: review

on:
  push:
    branches: [main]
    paths: ["content/pending/**", "content/posts/**", "content/events.yaml", "content/live.yaml", "templates/**", "site_assets/**", "config/**", "newsroom/**", "docs/charter.md", "content/opportunities.yaml"]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'newsroom-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q libfribidi0 libharfbuzz0b   # Arabic text shaping for image cards
      - run: pip install -r requirements.txt
      - run: python run.py --build-only
      - name: Technical check (internal links, alt text, titles, page weight)
        run: python tools/site_check.py public
      - name: Save decisions
        run: |
          git config user.name "newsroom-bot"
          git config user.email "newsroom-bot@users.noreply.github.com"
          git add -A content
          git commit -m "مراجعة: $(date -u +%F_%H%M)" || echo "no changes"
          git pull --rebase && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
