name: opportunities-links
# Monthly check of the official links in «الفرص والتطوير الرياضي». A broken link opens an issue.
on:
  schedule:
    - cron: "17 6 1 * *"       # day 1 of every month, 09:17 Riyadh
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - id: run
        run: |
          set +e
          python tools/check_opp_links.py > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - if: steps.run.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "روابط فرص معطلة — $(date +%Y-%m)" --body-file report.md
