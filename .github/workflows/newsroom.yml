# غرفة الأخبار: تعمل كل ساعتين من 06:00 إلى 22:00 بتوقيت الرياض، وتنشر الموقع على GitHub Pages مجاناً
# المتطلبات:
#   Settings → Pages → Source: GitHub Actions
#   Settings → Secrets and variables → Actions → ANTHROPIC_API_KEY
name: newsroom

on:
  schedule:
    - cron: "7 3-19/2 * * *"        # UTC = 06:07، 08:07 … 22:07 بتوقيت الرياض
  workflow_dispatch: {}

permissions:
  contents: write                   # حفظ الأخبار الجديدة وملف الحالة في المستودع
  pages: write
  id-token: write

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q libfribidi0 libharfbuzz0b   # Arabic text shaping for image cards
      - run: pip install -r requirements.txt
      - name: Collect, write, publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python run.py --publish
          else
            # لا مفتاح بعد: لا جمع آلي ولا تكلفة. يُبنى الموقع من الأخبار والمقالات اليدوية، ويبدأ النشر الآلي تلقائياً عند إضافة المفتاح
            echo "::notice::ANTHROPIC_API_KEY غير موجود — بناء الموقع من المحتوى اليدوي فقط"
            python run.py --build-only
          fi
      - name: Save content
        run: |
          git config user.name "newsroom-bot"
          git config user.email "newsroom-bot@users.noreply.github.com"
          git add -A content
          [ -d state ] && git add -A state
          git commit -m "أخبار: $(date -u +%F_%H%M)" || echo "no changes"
          git pull --rebase && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: out/
          retention-days: 14

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
